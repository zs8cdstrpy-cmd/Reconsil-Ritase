<style>
/* Layout: satu kolom sempit (maks 760px) seperti buku catatan sopir. Header menempel di atas, navigasi tab menempel di bawah. */
:root {
  --bg: #EDF0F0;
  --card: #FFFFFF;
  --card-2: #F5F7F7;
  --line: #D3DADB;
  --ink: #13262B;
  --muted: #566A70;
  --accent: #0B6A73;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFF0;
  --warn: #9A5B00;
  --warn-soft: #FFF1D1;
  --bad: #B3261E;
  --bad-soft: #FCE4E1;
  --good: #1B7A47;
  --good-soft: #DDF1E5;
  --shadow: 0 1px 2px rgba(19,38,43,.06), 0 4px 14px rgba(19,38,43,.06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1A1D; --card: #162428; --card-2: #1C2D32; --line: #2A3E44; --ink: #E7EFF0; --muted: #94AAB0;
    --accent: #55C6CE; --accent-ink: #062226; --accent-soft: #173A3E;
    --warn: #F2B85B; --warn-soft: #3A2D12; --bad: #FF8F85; --bad-soft: #3F1B18; --good: #6FD39A; --good-soft: #14341F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1A1D; --card: #162428; --card-2: #1C2D32; --line: #2A3E44; --ink: #E7EFF0; --muted: #94AAB0;
  --accent: #55C6CE; --accent-ink: #062226; --accent-soft: #173A3E;
  --warn: #F2B85B; --warn-soft: #3A2D12; --bad: #FF8F85; --bad-soft: #3F1B18; --good: #6FD39A; --good-soft: #14341F;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-block: 0 88px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 760px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 26px; line-height: 1; white-space: nowrap; }
.brand p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.brand { min-width: 0; }
.sync { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.sync.ok { color: var(--good); } .sync.err { color: var(--bad); }

/* tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabs .wrap { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.tab { background: none; border: 0; padding: 7px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; border-radius: 10px; min-width: 0; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }

main { padding-block: 16px 0; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.flat { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 440px) { .grid2.stack { grid-template-columns: 1fr; } }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sec-title { font-size: 20px; margin-bottom: 8px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* form controls */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
input, select, textarea {
  width: 100%; min-width: 0; min-height: 46px; padding: 9px 12px; background: var(--card); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 10px; font-size: 16px; font-weight: 500;
}
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 12px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 32px; text-overflow: ellipsis; }
input:focus, select:focus { border-color: var(--accent); }
input.warn { border-color: var(--warn); background: var(--warn-soft); }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.lockbadge { font-size: 11px; font-weight: 600; color: var(--muted, #566A70); background: var(--soft, #DCEFF0); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
input.locked { opacity: .75; cursor: not-allowed; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn:disabled { opacity: .5; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; min-height: 42px; font-weight: 600; color: var(--muted); padding: 4px 6px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* pills */
.pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--card-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }

/* day bar */
.daybar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.daybar h2 { font-size: 30px; line-height: 1.05; }
.daybar .nav { display: flex; gap: 8px; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.chip { flex: 0 0 auto; scroll-snap-align: center; width: 54px; padding: 7px 0 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.1; }
.chip .wd { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.chip .dn { font-family: var(--f-display); font-size: 22px; font-weight: 700; }
.chip .rt { font-size: 11px; font-weight: 700; min-height: 15px; color: var(--muted); }
.chip.has .rt { color: var(--good); }
.chip.today { border-color: var(--accent); }
.chip[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-current="true"] .wd, .chip[aria-current="true"] .rt { color: var(--accent-ink); opacity: .9; }

/* slot */
.slot { display: flex; flex-direction: column; gap: 10px; }
.slot-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.slot-head h3 { font-size: 22px; }
.result { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); flex-wrap: wrap; }
.result .km { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; }
.result .km small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.result .route { font-size: 14px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.diff { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.diff b { font-family: var(--f-display); font-size: 24px; line-height: 1.1; color: var(--ink); }
.diff.neg b { color: var(--bad); } .diff.pos b { color: var(--good); }
.note-warn { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-weight: 500; }

/* summaries */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); }
.tile .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tile .val { font-family: var(--f-display); font-size: 34px; font-weight: 700; line-height: 1.05; }
.tile .sub { font-size: 13px; color: var(--muted); }
.tile.neg .val { color: var(--bad); } .tile.pos .val { color: var(--good); }

.bars { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.bar .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.bar .ct { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1; }
.bar .ct small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 3px; }
.bar .track { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--card-2); border: 1px solid var(--line); overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.bd .fill { background: var(--warn); }
.bar .meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-top: -2px; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--card-2); }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; font-weight: 600; }
th:first-child { background: var(--card-2); }
tr:last-child td { border-bottom: 0; }
td.zero { color: var(--line); }
tfoot td { font-weight: 700; background: var(--card-2); }
.mx input { min-height: 38px; padding: 4px 6px; width: 78px; text-align: center; font-size: 14px; border-radius: 8px; }

/* locations */
.loc-list { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.loc { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.loc:last-child { border-bottom: 0; }
.loc .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.loc .sub { font-size: 13px; color: var(--muted); }
.loc .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.editbox { width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; margin-top: 6px; }
.distlist { display: grid; grid-template-columns: 1fr 110px; gap: 8px 10px; align-items: center; }
.distlist span { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.distlist input { min-height: 40px; text-align: right; }

/* gaji */
.pay { display: flex; flex-direction: column; }
.pay .ln { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); align-items: baseline; }
.pay .ln span:first-child { min-width: 0; overflow-wrap: anywhere; }
.pay .ln.sum { font-weight: 700; border-bottom: 1px solid var(--line); }
.pay .ln.big { border: 0; padding-top: 14px; }
.pay .ln.big span:last-child { font-family: var(--f-display); font-size: 34px; font-weight: 700; color: var(--accent); }
.pay h3 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-family: var(--f-body); font-weight: 700; margin: 12px 0 0; }

/* help */
.steps { counter-reset: s; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
.steps li::before { content: counter(s); font-family: var(--f-display); font-weight: 700; font-size: 20px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.steps h3 { font-size: 19px; margin-bottom: 2px; }
.steps p { margin: 0; color: var(--muted); font-size: 15px; }
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
code.k { background: var(--card-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 14px; }

.empty { text-align: center; padding: 22px 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .3s ease; } }

.photo-box{margin-top:12px;padding:12px;border:1px dashed #ccc;border-radius:12px;background:#fff}
.photo-box h3{margin:0 0 8px;font-size:14px}
.photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.photo-grid .ph{position:relative;width:88px;height:88px;border-radius:8px;overflow:hidden;border:1px solid #ddd}
.photo-grid .ph img{width:100%;height:100%;object-fit:cover}
.photo-grid .ph button{position:absolute;top:2px;right:2px;border:0;background:#000a;color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;line-height:22px;padding:0}
.f textarea{width:100%;min-height:110px;padding:10px;border:1px solid #ddd;border-radius:10px;font:inherit;box-sizing:border-box;resize:vertical}
.wa-fab{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 0 8px;padding:12px 16px;background:#25D366;color:#fff;border:0;border-radius:12px;font-weight:600;font-size:14px;width:100%;text-decoration:none;box-sizing:border-box}
.period-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.period-table th,.period-table td{border:1px solid #e0d5a0;padding:5px 6px;text-align:center}
.period-table th{background:#F5C400;color:#1a1a1a}
.period-table tr:nth-child(even) td{background:#fffbeb}
.period-table tr.zero td{background:#fce8ea}
.period-table .num{text-align:right;font-variant-numeric:tabular-nums}
.period-table tfoot td{font-weight:700;background:#fff6d1}

</style>

</head>

      cb(canvas.toDataURL('image/jpeg', 0.62));
    };
    img.onerror = function () { toast('Gagal baca gambar'); };

  };

function gajiCalc() {
  var s = S.settings, num = function (v) { return isNum(v) ? +v : 0; }, T = totals(1, N());
  var pp = P(), hk = isNum(pp.hkOverride) ? +pp.hkOverride : autoHK(), hb = num(s.hariBulan) || 28;

  if (s.kmBasis === 'pdf' && T.pdf) { kmUse = T.pdf; kmSrc = 'pdf'; }
  else if (s.kmBasis === 'manual') {
    if (isNum(pp.kmGaji)) { kmUse = +pp.kmGaji; kmSrc = 'manual-total'; }
    else if (T.hasManual) { kmUse = T.manual; kmSrc = 'manual-slot'; }
    else { kmUse = T.km; kmSrc = 'master'; }
  }
  // Gaji pokok: HK > 28 → full; HK 28 atau di bawah → prorata (gp × HK / 28)
  var gpFull = num(s.gp);
  var gpCap = 28;
  var gp = hk > gpCap ? gpFull : (gpFull / gpCap * hk);
  var ins = num(s.insentif) / (hb || 1) * Math.min(hk, hb || gpCap);
  var on = num(s.onsite) * hk, trv = num(pp.travel), rit = kmUse * num(s.tarif);
  var kotor = gp + ins + on + trv + rit;
  var tk = Math.round(gpFull * num(s.bpjsTk) / 100), kes = Math.round(gpFull * num(s.bpjsKes) / 100);

  var autoPct = num(s.pph) || 2.17;
  var pphManual = isNum(pp.pphNominal);
  var pph = 0, pphPct = 0, pphAuto = false;
  if (pphManual) {
    pph = num(pp.pphNominal);
    pphPct = kotor > 0 ? (pph / kotor * 100) : 0;
  } else {
    pphAuto = true;
    pphPct = autoPct;
    pph = Math.round(kotor * autoPct / 100);
  }
  var pphSlip = isNum(pp.pphSlip) ? num(pp.pphSlip) : null;
  var pphSelisih = pphSlip != null ? r2(pphSlip - pph) : null;
  var lain = num(pp.potLain);
  var pot = tk + kes + pph + lain, thp = kotor - pot;

  return { hk: hk, auto: autoHK(), hb: hb, gpCap: gpCap, kmUse: kmUse, kmSrc: kmSrc, basisPdf: s.kmBasis === 'pdf' && T.pdf > 0, gp: gp, gpFull: gpFull, gpCapped: hk > gpCap, ins: ins, on: on, trv: trv, rit: rit, kotor: kotor, tk: tk, kes: kes, pph: pph, pphPct: pphPct, pphAuto: pphAuto, pphSlip: pphSlip, pphSelisih: pphSelisih, lain: lain, pot: pot, thp: thp, klaimKm: klaimKm, klaim: klaim, T: T, tarif: num(s.tarif) };
}

  var html = '<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">';
  html += '<title>Slip Gaji — ' + esc(nama) + '</title><style>';
  html += ':root{--y:#F5C400;--yl:#FFF6D1;--ys:#FFFBEB;--bk:#1A1A1A;--dk:#2D2D2D;--mu:#5A5A5A;--bd:#E0D5A0;--ok:#0D7A4F;--pink:#FCE8EA;--grn:#D4EDDA}';
  html += '*{box-sizing:border-box;margin:0;padding:0}';
  html += 'body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:11px;color:var(--bk);background:#f0f0f0;line-height:1.35}';
  html += '.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:#fff;border-bottom:2px solid var(--y);box-shadow:0 1px 4px rgba(0,0,0,.08)}';
  html += '.toolbar button{padding:9px 16px;font-size:13px;font-weight:700;border:0;border-radius:8px;cursor:pointer}';
  html += '.btn-print{background:var(--y);color:var(--bk)}.btn-print:hover{filter:brightness(.95)}';
  html += '.btn-close{background:var(--dk);color:#fff}.hint{color:var(--mu);font-size:12px}';
  html += '.page{max-width:210mm;margin:16px auto;background:#fff;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.1);overflow:hidden;border:1px solid var(--bd)}';
  html += '.accent-top{height:5px;background:linear-gradient(90deg,var(--y),#e0a800,var(--y))}';
  html += '.header{background:var(--yl);padding:14px 18px 10px;text-align:center;border-bottom:2px solid var(--y)}';
  html += '.header img.logo{height:56px;width:auto;margin-bottom:6px;object-fit:contain}';
  html += '.header h1{font-size:20px;font-weight:800;color:var(--bk);letter-spacing:1.5px;margin:2px 0}';
  html += '.header .sub{font-size:10px;color:var(--mu)}';
  html += '.body{padding:14px 16px 16px}';
  html += '.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;background:var(--ys);border:1.5px solid var(--y);border-radius:8px;padding:10px 12px;margin-bottom:12px}';
  html += '.meta .row{display:flex;gap:6px;font-size:11px}.meta .lbl{color:var(--mu);min-width:52px}.meta .val{font-weight:700}';
  html += '.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;margin-bottom:12px}';
  html += '.card{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;background:#fff}';
  html += '.sec{font-size:10px;font-weight:800;color:var(--bk);text-transform:uppercase;letter-spacing:.3px;margin:8px 0 5px;padding-bottom:3px;border-bottom:2px solid var(--y)}';
  html += '.sec:first-child{margin-top:0}';
  html += '.ln{display:flex;justify-content:space-between;align-items:baseline;padding:2.5px 0;font-size:10.5px;gap:8px}';
  html += '.ln .l{flex:1}.ln .v{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}';
  html += '.ln.total{margin-top:6px;padding:6px 12px;border-top:2px solid var(--y);background:var(--yl);margin-left:-12px;margin-right:-12px;font-weight:700}';
  html += '.ln.thp{background:var(--grn);border-top:none;margin-top:4px;padding:8px 12px;border-radius:0 0 6px 6px;font-size:12px}';
  html += '.ln.thp .v{color:var(--ok);font-size:13px;font-weight:800}';
  html += '.rekap-wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-bottom:12px}';
  html += 'table.rekap{width:100%;border-collapse:collapse;font-size:9.5px;border-radius:8px;overflow:hidden;border:1.5px solid var(--bk)}';
  html += 'table.rekap th{background:var(--y);color:var(--bk);font-weight:700;padding:5px 6px;text-align:center}';
  html += 'table.rekap td{padding:3.5px 6px;border-bottom:1px solid var(--bd);text-align:center}';
  html += 'table.rekap td.num{text-align:right;font-variant-numeric:tabular-nums}';
  html += 'table.rekap tr:nth-child(even) td{background:#fffeef}';
  html += 'table.rekap tr.zero td{background:var(--pink)}';
  html += 'table.rekap tr.tot td{background:var(--yl);font-weight:700;border-top:2px solid var(--y)}';
  html += '.hk{border:1px solid var(--bd);border-radius:8px;overflow:hidden}';
  html += '.hk h3{background:var(--ys);padding:6px 10px;font-size:10px;color:var(--bk);border-bottom:1px solid var(--bd);font-weight:700}';
  html += '.hk .item{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:10px;border-bottom:1px solid #eee}';
  html += '.hk .item:last-child{border-bottom:0}';
  html += '.badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:18px;border-radius:4px;font-size:8px;font-weight:700;padding:0 4px}';
  html += '.b-hk,.b-hl,.b-s{background:var(--y);color:var(--bk)}.b-cr{background:#2a6bb5;color:#fff}.b-off{background:#6b7280;color:#fff}.b-a{background:#dc3545;color:#fff}';
  html += '.foot{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-top:4px}';
  html += '.bank{background:var(--ys);border:1.5px solid var(--y);border-radius:8px;padding:10px 12px;font-size:10px}';
  html += '.bank b{display:block;margin-bottom:4px;color:var(--bk)}.bank .opt{margin:2px 0;color:var(--dk)}';
  html += '.bank .opt.active{font-weight:700;color:var(--bk)}';
  html += '.sign{border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:center;min-height:90px;display:flex;flex-direction:column;justify-content:space-between}';
  html += '.sign .lbl{font-size:10px;color:var(--mu)}.sign .name{font-size:10.5px;font-weight:700;margin-top:28px}';
  html += '.sign .line{border-top:1px solid #ccc;margin-top:6px;padding-top:4px;font-size:9px;color:var(--mu)}';
  html += '.note{text-align:center;font-size:8.5px;color:var(--mu);margin-top:12px;padding-top:8px;border-top:2px solid var(--y)}';

function updateGaji() {
  var g = gajiCalc(), L = function (a, b, c) { return '<div class="ln' + (c ? ' ' + c : '') + '"><span>' + a + '</span><span class="num">' + b + '</span></div>'; };
  var h = '<div class="pay"><h3>Penghasilan</h3>';
  h += L('Hari kerja (HK)' + (isNum(P().hkOverride) ? ' manual' : ' otomatis dari shift'), g.hk + (g.hb ? ' / ' + g.hb : ''));
  h += L('Gaji pokok' + (g.gpCapped ? ' (full, HK > ' + g.gpCap + ')' : ' (prorata ≤ ' + g.gpCap + ' HK)'), rp(g.gp)) + L('Insentif kehadiran prorata', rp(g.ins)) + L('Tunjangan on site', rp(g.on)) + L('Travel allowance', rp(g.trv));
  var srcLbl = g.kmSrc === 'pdf' ? 'dari PDF' : g.kmSrc === 'manual-total' ? 'manual (total gaji)' : g.kmSrc === 'manual-slot' ? 'manual (jumlah slot)' : 'hitungan master';
  h += L('Tunjangan ritase (' + km(g.kmUse) + ' km × ' + rp(g.tarif) + ', ' + srcLbl + ')', rp(g.rit));
  h += L('Total penghasilan kotor', rp(g.kotor), 'sum');
  var pphLabel = g.pphAuto
    ? ('PPh 21 otomatis (' + (Math.round(g.pphPct * 100) / 100) + '% × kotor)')
    : ('PPh 21 manual' + (g.kotor > 0 ? ' (' + (Math.round(g.pphPct * 100) / 100) + '% dari kotor)' : ''));
  h += '<h3>Potongan</h3>' + L('BPJS Ketenagakerjaan (JHT)', rp(g.tk)) + L('BPJS Kesehatan', rp(g.kes)) + L(pphLabel, rp(g.pph)) + L('Potongan lain', rp(g.lain)) + L('Total potongan', rp(g.pot), 'sum');
  h += L('Take home', rp(g.thp), 'big');
  h += '<h3>Bandingkan dengan slip</h3>';
  if (g.pphSlip != null) {
    h += L('PPh 21 di slip gaji', rp(g.pphSlip));
    h += L('Selisih (slip − hitungan app)', (g.pphSelisih > 0 ? '+' : '') + rp(g.pphSelisih));
    h += '<p class="small muted" style="margin:6px 0 0">' + (g.pphSelisih > 0 ? 'Slip memotong lebih besar dari app.' : g.pphSelisih < 0 ? 'Slip memotong lebih kecil dari app.' : 'Sama dengan hitungan app.') + '</p>';
  } else {
    h += '<p class="small muted" style="margin:8px 0 0">Isi <b>PPh 21 di slip gaji</b> di tab Driver untuk melihat selisih dengan hitungan app.</p>';
  }
  h += '<h3>Klaim selisih KM</h3>';
  if (g.klaimKm > 0) h += L('KM PDF kurang ' + km(g.klaimKm) + ' km dari hitungan', '+ ' + rp(g.klaim)) + L('Take home + klaim', rp(g.thp + g.klaim), 'sum');
  else h += '<p class="small muted" style="margin:8px 0 0">' + (g.T.pdf ? 'KM PDF tidak lebih kecil dari hitungan master, jadi tidak ada klaim.' : 'Isi KM PDF di tab Catat untuk melihat selisih dan potensi klaim.') + '</p>';
  h += '</div>';
  var el = $('#gres'); if (el) el.innerHTML = h;
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {

  if (el.dataset.day) { UI.day = +el.dataset.day; render(); return; }
  if (el.dataset.nav) { UI.day = Math.min(30, Math.max(1, UI.day + +el.dataset.nav)); render(); window.scrollTo(0, 0); return; }
  if (el.dataset.shift) { if (locked()) { toast('Buku periode ini ditutup'); return; } var d = getDay(UI.day, true); d.shift = d.shift === el.dataset.shift ? '' : el.dataset.shift; $$('#shift button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.shift === d.shift)); }); touch(); return; }
  if (el.dataset.basis) { S.settings.kmBasis = el.dataset.basis; $$('#basis button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.basis === el.dataset.basis)); }); touch(); updateGaji(); return; }
  if (el.dataset.addtype) { UI.draft.name = ($('#an') || {}).value || ''; UI.draft.abs = ($('#aa') || {}).value || ''; UI.adding = el.dataset.addtype; render(); return; }
  var a = el.dataset.act; if (!a) return;
  if (locked() && (a === 'copyprev' || a === 'clearday')) { toast('Buku periode ini ditutup'); return; }
  if (a === 'copyprev') {
    var prev = getDay(UI.day - 1); if (!prev) { toast('Hari sebelumnya masih kosong'); return; }
    var cur = getDay(UI.day, true); cur.shift = prev.shift; cur.slots = prev.slots.map(function (s) { return { l: s.l, d: s.d, bd: s.bd, lj: s.lj || '', pdf: '', note: '', kmManual: s.kmManual || '' }; });
    touch(); render(); toast('Slot disalin. KM PDF dikosongkan.');
  } else if (a === 'clearday') {
    if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Ketuk lagi untuk mengosongkan'; setTimeout(function () { el.dataset.sure = ''; el.textContent = 'Kosongkan hari ini'; }, 3000); return; }
    delete P().days[String(UI.day)]; touch(); render(); toast('Hari dikosongkan');
  } else if (a === 'copyrekap') copyText(rekapText());
  else if (a === 'csv') saveCsv();
  else if (a === 'csvimport') { var cf = $('#csvFile'); if (cf) cf.click(); }
  else if (a === 'genslip') openSlip();
  else if (a === 'kirimsaran') {
    var jenis = ($('#saranJenis') || {}).value || 'Saran';
    var isi = (($('#saranIsi') || {}).value || '').trim();
    var nama = (S.settings && S.settings.nama) || '';
    var body = 'Jenis: ' + jenis + '\n' + (nama ? 'Nama: ' + nama + '\n' : '') + 'Pesan:\n' + (isi || '(kosong)');
    var url = 'https://wa.me/6281355407276?text=' + encodeURIComponent(body);
    window.open(url, '_blank');
  }

  else if (a === 'addphoto') {
    var pf = $('#photoFile'); if (pf) pf.click();
  }
  else if (a === 'delphoto') {
    var d = getDay(UI.day, true);
    if (!d.photos) d.photos = [];
    var ix = +el.dataset.i;
    if (ix >= 0 && ix < d.photos.length) { d.photos.splice(ix, 1); touch(); render(); toast('Foto dihapus'); }
  }

  else if (a === 'closebook') {
    if (el.dataset.sure !== '1') {
      var inc = totals(1, N()).incomplete; el.dataset.sure = '1';
      el.textContent = inc ? inc + ' slot belum lengkap. Ketuk lagi untuk tutup' : 'Ketuk lagi untuk menutup buku';
      var box = el.parentNode && el.parentNode.parentNode;
      if (box && !box.querySelector('.close-preview')) {
        var prev = document.createElement('div');
        prev.className = 'close-preview';
        prev.style.marginTop = '12px';
        prev.innerHTML = '<div class="eyebrow" style="margin-bottom:6px">Preview sebelum tutup buku</div>' + periodDailyTableHtml(1, N());
        box.appendChild(prev);
      }
      setTimeout(function () { el.dataset.sure = ''; el.textContent = 'Tutup buku'; }, 6000); return;
    }
    P().closed = true; P().closedAt = todayStr(); touch(); render(); toast('Buku ditutup. Disarankan: unduh cadangan JSON di tab Driver');
  }
  else if (a === 'openbook') { P().closed = false; P().closedAt = ''; touch(); render(); toast('Buku dibuka kembali'); }
  else if (a === 'newperiod') {
    var ch = periodChain(), ix = -1; ch.forEach(function (q, n) { if (q.start === UI.cur) ix = n; });
    var nx = ch[ix + 1]; if (!nx) { toast('Tidak ada periode berikutnya'); return; }
    selectPeriod(nx.start); render(); window.scrollTo(0, 0); toast(periodTitle(nx.start, nx.end));
  }
  else if (a === 'resethk' || a === 'resetrekap') {
    if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Ketuk lagi untuk reset'; setTimeout(function () { el.dataset.sure = ''; el.textContent = el.dataset.label; }, 3500); return; }
    var pd = P().days;
    if (a === 'resethk') { Object.keys(pd).forEach(function (k) { pd[k].shift = ''; }); P().hkOverride = ''; toast('HK direset'); }
    else { Object.keys(pd).forEach(function (k) { pd[k].slots = [blankSlot(), blankSlot(), blankSlot()]; }); toast('Rekapan direset'); }
    touch(); render();
  }
  else if (a === 'backup') { downloadFile('cadangan-ritase-' + todayStr() + '.json', JSON.stringify(serialize()), 'application/json'); toast('Cadangan diunduh'); }
  else if (a === 'update') {
    var fin = function () { location.reload(); };
    Promise.all([navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : 0, window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0]).then(fin, fin);
  }
  else if (a === 'restore') { var rf = $('#restoreFile'); if (rf) rf.click(); }
  else if (a === 'addopen') { UI.adding = el.dataset.type; UI.draft = { name: '', abs: '' }; UI.edit = null; render(); }
  else if (a === 'addcancel') { UI.adding = null; render(); }
  else if (a === 'addsave') addSave();
  else if (a === 'editloc') { var same = UI.edit && UI.edit.type === el.dataset.type && UI.edit.name === el.dataset.name; UI.edit = same ? null : { type: el.dataset.type, name: el.dataset.name, confirm: false }; UI.adding = null; render(); }
  else if (a === 'canceledit') { UI.edit = null; render(); }
  else if (a === 'saveloc') editSave();
  else if (a === 'delloc') {
    if (!UI.edit.confirm) { UI.edit.confirm = true; render(); return; }
    var t = UI.edit.type, nm = UI.edit.name;
    if (t === 'l') S.loadings = S.loadings.filter(function (x) { return x.name !== nm; }); else S.dumpings = S.dumpings.filter(function (x) { return x.name !== nm; });
    S.dist = S.dist.filter(function (x) { return !(t === 'l' ? x.l === nm : x.d === nm); }); rebuildDist(); UI.edit = null; touch(); render(); toast('Lokasi dihapus');
  }
});
function nameError(type, name, except) {
  if (!name) return 'Nama lokasi belum diisi.';
  if (/[|]/.test(name)) return 'Nama tidak boleh memakai tanda |.';
  if (name === BD || name.toLowerCase() === BD_LABEL.toLowerCase() || name.toLowerCase() === LJB.toLowerCase()) return 'Nama itu sudah dipakai oleh bawaan.';
  var list = type === 'l' ? S.loadings : S.dumpings;
  if (list.some(function (x) { return x.name.toLowerCase() === name.toLowerCase() && x.name !== except; })) return 'Nama itu sudah ada di daftar.';
  return '';
}
function addSave() {
  var t = UI.adding, name = ($('#an').value || '').trim(), err = nameError(t, name, null), box = $('#aerr');
  if (err) { box.textContent = err; box.hidden = false; return; }
  var abs = $('#aa').value || '';
  var opp = t === 'l' ? S.dumpings : S.loadings;
  if (t === 'l') S.loadings.push({ name: name, abs: isNum(abs) ? +abs : '' }); else S.dumpings.push({ name: name, abs: isNum(abs) ? +abs : '' });
  $$('[data-ad]').forEach(function (inp) {
    var o = opp[+inp.dataset.ad]; if (!o || !isNum(inp.value)) return;
    S.dist.push(t === 'l' ? { l: name, d: o.name, km: +inp.value } : { l: o.name, d: name, km: +inp.value });
  });
  rebuildDist(); UI.adding = null; UI.draft = { name: '', abs: '' }; touch(); render(); toast('Lokasi ditambahkan');
}
function editSave() {
  var e = UI.edit, name = ($('#en').value || '').trim(), err = nameError(e.type, name, e.name);
  if (err) { toast(err); return; }
  var list = e.type === 'l' ? S.loadings : S.dumpings, obj = list.filter(function (x) { return x.name === e.name; })[0];
  var a = $('#ea').value; obj.abs = isNum(a) ? +a : '';
  renameLoc(e.type, e.name, name); obj.name = name; rebuildDist(); UI.edit = null; touch(); render(); toast('Perubahan disimpan');
}
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'pperiod') { selectPeriod(t.value); render(); window.scrollTo(0, 0); return; }
  if (t.id === 'photoFile' && t.files && t.files[0]) {
    var file = t.files[0];
    t.value = '';
    compressImage(file, function (dataUrl) {
      var d = getDay(UI.day, true);
      if (!d.photos) d.photos = [];
      if (d.photos.length >= 4) { toast('Maksimal 4 foto per hari'); return; }
      d.photos.push(dataUrl);
      touch(); render(); toast('Foto timesheet disimpan');
    });
    return;
  }
  if (t.id === 'csvFile') {

    var cfile = t.files && t.files[0]; if (!cfile) return;
    var cr = new FileReader();
    cr.onload = function () { try { importCsv(String(cr.result)); } catch (er) { UI.importMsg = 'Gagal membaca file CSV.'; render(); } };
    cr.readAsText(cfile); t.value = ''; return;
  }
  if (t.id === 'restoreFile') {
    var file = t.files && t.files[0]; if (!file) return;
    var fr = new FileReader();
    fr.onload = function () { try { var j = JSON.parse(String(fr.result)); if (!j || !j.loadings) throw 0; S = normalize(j); rebuildDist(); initUi(); touch(); render(); toast('Data dipulihkan'); } catch (x) { toast('File cadangan tidak valid'); } };
    fr.readAsText(file); t.value = ''; return;
  }
  if (t.id === 'rf' || t.id === 'rt') {
    UI.from = +$('#rf').value; UI.to = +$('#rt').value;
    if (UI.from > UI.to) { if (t.id === 'rf') UI.to = UI.from; else UI.from = UI.to; }
    render(); return;
  }
  var card = t.closest('.slot');
  if (card && locked()) return;
  if (card && (t.dataset.f === 'l' || t.dataset.f === 'd' || t.dataset.f === 'lj')) {
    var i = +card.dataset.slot, n = UI.day; ensureShift(n);
    var s = getDay(n, true).slots[i]; s[t.dataset.f] = t.value;
    if (t.dataset.f === 'd' && t.value !== BD) { s.lj = ''; if (s.l !== LJB) s.bd = ''; }
    if (t.dataset.f === 'l') { if (t.value === LJB && s.d === BD) { s.d = ''; s.lj = ''; } else if (t.value !== LJB && s.d !== BD) s.bd = ''; }
    touch(); card.outerHTML = slotHtml(n, i); refreshSlotDerived(i);
  }
});
document.addEventListener('input', function (e) {
  var t = e.target, card = t.closest('.slot');
  if (card && locked()) return;

    var i = +card.dataset.slot, n = UI.day; ensureShift(n);

    var p = t.dataset.mx.split(','), l = S.loadings[+p[0]], d = S.dumpings[+p[1]];
    setDist(l.name, d.name, t.value); t.classList.toggle('warn', !isNum(t.value)); touch();

  }
});
document.addEventListener('visibilitychange', async function () {
  if (document.visibilityState !== 'visible' || !db || dirty || saving || !loaded) return;
  var ae = document.activeElement; if (ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName)) return;

    var snap = await db.doc('app/main').get();
    if (snap.exists && !dirty && snap.data().updated !== lastSaved) { S = normalize(snap.data()); lastSaved = snap.data().updated || ''; rebuildDist(); render(); }
  } catch (e) {}
});
