<style>
/* Layout: satu kolom sempit (maks 760px) seperti buku catatan sopir. Header menempel di atas, navigasi tab menempel di bawah. */
:root {
  --bg: #EDF0F0;
  --card: #FFFFFF;
  --card-2: #F5F7F7;
  --line: #D3DADB;
  --ink: #13262B;
  --muted: #566A70;
  --accent: #0B6A73;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFF0;
  --warn: #9A5B00;
  --warn-soft: #FFF1D1;
  --bad: #B3261E;
  --bad-soft: #FCE4E1;
  --good: #1B7A47;
  --good-soft: #DDF1E5;
  --shadow: 0 1px 2px rgba(19,38,43,.06), 0 4px 14px rgba(19,38,43,.06);
  --f-display: "HelveticaNeue-CondensedBold", "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1A1D; --card: #162428; --card-2: #1C2D32; --line: #2A3E44; --ink: #E7EFF0; --muted: #94AAB0;
    --accent: #55C6CE; --accent-ink: #062226; --accent-soft: #173A3E;
    --warn: #F2B85B; --warn-soft: #3A2D12; --bad: #FF8F85; --bad-soft: #3F1B18; --good: #6FD39A; --good-soft: #14341F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1A1D; --card: #162428; --card-2: #1C2D32; --line: #2A3E44; --ink: #E7EFF0; --muted: #94AAB0;
  --accent: #55C6CE; --accent-ink: #062226; --accent-soft: #173A3E;
  --warn: #F2B85B; --warn-soft: #3A2D12; --bad: #FF8F85; --bad-soft: #3F1B18; --good: #6FD39A; --good-soft: #14341F;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-block: 0 88px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 760px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 26px; line-height: 1; white-space: nowrap; }
.brand p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.brand { min-width: 0; }
.sync { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.sync.ok { color: var(--good); } .sync.err { color: var(--bad); }

/* tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.tab { background: none; border: 0; padding: 7px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; border-radius: 10px; min-width: 0; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }

main { padding-block: 16px 0; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.flat { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 440px) { .grid2.stack { grid-template-columns: 1fr; } }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sec-title { font-size: 20px; margin-bottom: 8px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* form controls */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
input, select, textarea {
  width: 100%; min-width: 0; min-height: 46px; padding: 9px 12px; background: var(--card); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 10px; font-size: 16px; font-weight: 500;
}
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 12px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 32px; text-overflow: ellipsis; }
input:focus, select:focus { border-color: var(--accent); }
input.warn { border-color: var(--warn); background: var(--warn-soft); }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn:disabled { opacity: .5; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; min-height: 42px; font-weight: 600; color: var(--muted); padding: 4px 6px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* pills */
.pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--card-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }

/* day bar */
.daybar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.daybar h2 { font-size: 30px; line-height: 1.05; }
.daybar .nav { display: flex; gap: 8px; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.chip { flex: 0 0 auto; scroll-snap-align: center; width: 54px; padding: 7px 0 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.1; }
.chip .wd { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.chip .dn { font-family: var(--f-display); font-size: 22px; font-weight: 700; }
.chip .rt { font-size: 11px; font-weight: 700; min-height: 15px; color: var(--muted); }
.chip.has .rt { color: var(--good); }
.chip.today { border-color: var(--accent); }
.chip[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-current="true"] .wd, .chip[aria-current="true"] .rt { color: var(--accent-ink); opacity: .9; }

/* slot */
.slot { display: flex; flex-direction: column; gap: 10px; }
.slot-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.slot-head h3 { font-size: 22px; }
.result { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); flex-wrap: wrap; }
.result .km { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; }
.result .km small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.result .route { font-size: 14px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.diff { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.diff b { font-family: var(--f-display); font-size: 24px; line-height: 1.1; color: var(--ink); }
.diff.neg b { color: var(--bad); } .diff.pos b { color: var(--good); }
.note-warn { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-weight: 500; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); }

.tile .sub { font-size: 13px; color: var(--muted); }
.tile.neg .val { color: var(--bad); } .tile.pos .val { color: var(--good); }

.bar { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.bar .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.bar .ct { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1; }
.bar .ct small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 3px; }
.bar .track { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--card-2); border: 1px solid var(--line); overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.bd .fill { background: var(--warn); }
.bar .meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-top: -2px; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--card-2); }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; font-weight: 600; }
th:first-child { background: var(--card-2); }
tr:last-child td { border-bottom: 0; }
td.zero { color: var(--line); }
tfoot td { font-weight: 700; background: var(--card-2); }
.mx input { min-height: 38px; padding: 4px 6px; width: 78px; text-align: center; font-size: 14px; border-radius: 8px; }

.loc-list { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.loc { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }

.loc .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.loc .sub { font-size: 13px; color: var(--muted); }
.loc .acts { display: flex; gap: 6px; flex-wrap: wrap; }

.distlist { display: grid; grid-template-columns: 1fr 110px; gap: 8px 10px; align-items: center; }
.distlist span { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.distlist input { min-height: 40px; text-align: right; }

.pay { display: flex; flex-direction: column; }
.pay .ln { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); align-items: baseline; }
.pay .ln span:first-child { min-width: 0; overflow-wrap: anywhere; }
.pay .ln.sum { font-weight: 700; border-bottom: 1px solid var(--line); }
.pay .ln.big { border: 0; padding-top: 14px; }
.pay .ln.big span:last-child { font-family: var(--f-display); font-size: 34px; font-weight: 700; color: var(--accent); }
.pay h3 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-family: var(--f-body); font-weight: 700; margin: 12px 0 0; }

/* help */
.steps { counter-reset: s; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
.steps li::before { content: counter(s); font-family: var(--f-display); font-weight: 700; font-size: 20px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.steps h3 { font-size: 19px; margin-bottom: 2px; }
.steps p { margin: 0; color: var(--muted); font-size: 15px; }
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
code.k { background: var(--card-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 14px; }

.empty { text-align: center; padding: 22px 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .3s ease; } }
</style>

    Object.keys(raw.periods).forEach(function (k) {
      var p = raw.periods[k] || {};
      per[k] = { start: p.start || k, end: p.end || periodEndFor(p.start || k, st.closeDay), closed: !!p.closed, closedAt: p.closedAt || '', hkOverride: p.hkOverride == null ? '' : p.hkOverride, travel: p.travel == null ? '' : p.travel, potLain: p.potLain == null ? '' : p.potLain, days: p.days && typeof p.days === 'object' ? p.days : {} };
    });
  } else if (raw.days && typeof raw.days === 'object') {

    var p0 = newPeriod(s0, st.closeDay);
    p0.days = raw.days; p0.hkOverride = rs.hkOverride == null ? '' : rs.hkOverride; p0.travel = rs.travel ? rs.travel : ''; p0.potLain = rs.potLain ? rs.potLain : '';

  return { v: 2, settings: st, loadings: Array.isArray(raw.loadings) ? raw.loadings : base.loadings, dumpings: Array.isArray(raw.dumpings) ? raw.dumpings : base.dumpings, dist: Array.isArray(raw.dist) ? raw.dist : base.dist, periods: per };
}
function P() { return S.periods[UI.cur]; }

  var t = todayStr(), keys = periodKeys(), hit = null;
  keys.forEach(function (k) { var p = S.periods[k]; if (p.start <= t && t <= p.end) hit = k; });
  return hit || keys[keys.length - 1];
}
function getDay(n, create) {

/* ---------- dates ---------- */

  var t = new Date(); t = new Date(t.getFullYear(), t.getMonth(), t.getDate());

/* ---------- calculation ---------- */
function calcSlot(s) {
  var r = { st: 'empty', counted: false, km: 0, known: false, route: '', diff: null };
  if (!s || (!s.l && !s.d)) return r;
  if (!s.l || !s.d) { r.st = 'partial'; return r; }
  r.route = s.l + ' → ' + (s.d === BD ? BD_LABEL : s.d);
  var l = loadObj(s.l);
  if (!l) { r.st = 'partial'; r.route = ''; return r; }
  if (s.d === BD) {
    r.counted = true;
    if (!isNum(s.bd)) { r.st = 'needbd'; }
    else if (!isNum(l.abs)) { r.st = 'noabs'; }
    else { r.km = Math.abs(+l.abs - +s.bd); r.known = true; r.st = 'ok'; }
  } else {
    if (!dumpObj(s.d)) { r.st = 'partial'; r.route = ''; return r; }
    r.counted = true;
    var v = D[s.l + '|' + s.d];
    if (v == null) { r.st = 'missing'; } else { r.km = v; r.known = true; r.st = 'ok'; }
  }
  if (r.known && isNum(s.pdf)) r.diff = r2(+s.pdf - r.km);
  return r;
}
function calcDay(n) {
  var d = getDay(n), o = { rit: 0, km: 0, pdf: 0, diff: 0, hasDiff: false, filled: 0 };
  if (!d) return o;
  d.slots.forEach(function (s) {
    var c = calcSlot(s);
    if (c.counted) { o.rit++; o.km += c.km; }
    if (c.st !== 'empty') o.filled++;
    if (isNum(s.pdf)) o.pdf += +s.pdf;
    if (c.diff != null) { o.diff += c.diff; o.hasDiff = true; }
  });
  o.km = r2(o.km); o.pdf = r2(o.pdf); o.diff = r2(o.diff);
  return o;
}
function allTrips(from, to) {
  var out = [];
  for (var n = from; n <= to; n++) {
    var d = getDay(n); if (!d) continue;
    d.slots.forEach(function (s, i) {
      var c = calcSlot(s);
      if (c.counted) out.push({ day: n, slot: i + 1, l: s.l, d: s.d, km: c.km, pdf: isNum(s.pdf) ? +s.pdf : null, diff: c.diff, st: c.st, note: s.note || '', bd: s.d === BD ? s.bd : '' });
    });
  }

}
function autoHK() {
  var h = 0;
  for (var n = 1; n <= N(); n++) { var d = getDay(n); if (d && (d.shift === 'NS' || d.shift === 'DS')) h++; }
  return h;
}
function totals(from, to) {
  if (to == null) to = N();
  var t = { rit: 0, km: 0, pdf: 0, diff: 0, incomplete: 0 };
  for (var n = from; n <= to; n++) {
    var c = calcDay(n); t.rit += c.rit; t.km += c.km; t.pdf += c.pdf; t.diff += c.diff;
    var d = getDay(n); if (d) d.slots.forEach(function (s) { if (calcSlot(s).st === 'partial') t.incomplete++; });
  }
  t.km = r2(t.km); t.pdf = r2(t.pdf); t.diff = r2(t.diff);
  return t;
}
function missingPairs() {
  var m = 0;
  S.loadings.forEach(function (l) { S.dumpings.forEach(function (d) { if (D[l.name + '|' + d.name] == null) m++; }); });
  return m;

/* ---------- persistence ---------- */
var db = null, mode = 'local', dirty = false, saving = false, timer = null, loaded = false;
var lastSaved = '';
function serialize() {
  var per = {};
  Object.keys(S.periods).forEach(function (pk) {
    var p = S.periods[pk], days = {};
    Object.keys(p.days).forEach(function (k) {
      var d = p.days[k];
      var any = d.shift || d.slots.some(function (s) { return s.l || s.d || s.note || isNum(s.pdf) || isNum(s.bd); });
      if (any) days[k] = d;
    });
    per[pk] = { start: p.start, end: p.end, closed: !!p.closed, closedAt: p.closedAt || '', hkOverride: p.hkOverride, travel: p.travel, potLain: p.potLain, days: days };
  });
  lastSaved = new Date().toISOString();
  return { v: 2, settings: S.settings, loadings: S.loadings, dumpings: S.dumpings, dist: S.dist, periods: per, updated: lastSaved };
}
function setSync(text, cls) { var e = $('#sync'); e.textContent = text; e.className = 'sync' + (cls ? ' ' + cls : ''); }

function touch() {

}
async function flush() {
  if (saving) { timer = setTimeout(flush, 300); return; }
  if (!dirty) return;
  if (!db) { dirty = false; var a = idleLabel(); setSync(a[0], a[1]); return; }
  saving = true; dirty = false;
  try { await db.doc('app/main').set(serialize()); mode = 'db'; }
  catch (e) { mode = 'local'; setSync('Gagal simpan ke akun', 'err'); saving = false; return; }
  saving = false;
  if (dirty) { timer = setTimeout(flush, 100); return; }
  var b = idleLabel(); setSync(b[0], b[1]);
}
async function boot() {
  var local = null;
  try { var t = localStorage.getItem('ritase-v1'); if (t) local = JSON.parse(t); } catch (e) {}
  if (local) S = normalize(local);
  rebuildDist(); initUi(); render();
  var a = idleLabel(); setSync(a[0], a[1]);
  try {
    if (window.claude && window.claude.use) db = await window.claude.use('db');
    if (db) {
      var snap = await db.doc('app/main').get();
      if (snap.exists && !dirty) { S = normalize(snap.data()); lastSaved = snap.data().updated || ''; rebuildDist(); initUi(); render(); }

      mode = 'db';

    ['Tutup buku dan buka periode baru', 'Setelah tanggal tutup dan semua catatan lengkap, ketuk Tutup buku di kotak Periode buku. Catatan periode itu dikunci. Ketuk Buka kembali bila perlu koreksi. Ketuk + Periode baru untuk membuka buku berikutnya. Periode lama bisa dipilih kapan saja dari daftar periode.']
  ].forEach(function (s) { h += '<li><div><h3>' + s[0] + '</h3><p>' + s[1] + '</p></div></li>'; });
  h += '</ol></section>';
  h += '<section class="card"><h2 class="sec-title">Aturan hitung</h2><ul class="rules">';
  h += '<li>Ritase dihitung bila loading dan dumping sama-sama terisi. Slot yang baru terisi salah satunya ditandai "Belum lengkap" dan belum dihitung.</li>';
  h += '<li>Jarak loading ke dumping diambil dari matriks jarak di tab Lokasi. Pasangan yang belum ada jaraknya ditandai kuning, isi langsung di slot atau di matriks.</li>';
  h += '<li>Dumping "Parkiran Tofu/Gantungan" hanya menghitung jarak dari loading ke titik gantung, bukan ke POS12 atau FENI.</li>';
  h += '<li>BD di jalan: jarak = selisih antara KM absolut loading dan KM titik BD. Loading harus punya KM absolut (isi lewat Ubah di tab Lokasi).</li>';
  h += '<li>Ritase gaji = total KM × tarif per KM. Pilih dasar KM dari PDF atau dari hitungan master di tab Gaji.</li></ul></section>';
  h += '<section class="card"><h2 class="sec-title">Penyimpanan data</h2><p style="margin:0;color:var(--muted);font-size:15px">' + (STANDALONE ? 'Setiap perubahan tersimpan otomatis di browser HP ini dan tetap bisa dipakai tanpa sinyal setelah halaman dibuka sekali. Jangan hapus data situs di pengaturan browser. Gunakan Unduh cadangan di tab Gaji secara berkala, dan Unduh CSV di tab Rekap untuk laporan.' : 'Setiap perubahan tersimpan otomatis. Label di pojok kanan atas menunjukkan statusnya. "Tersimpan di akun" berarti data ikut ke HP atau komputer lain yang membuka halaman ini dengan akun yang sama. "Tersimpan di perangkat ini" berarti data hanya ada di browser ini, jadi jangan hapus data situs. Gunakan Unduh CSV di tab Rekap untuk cadangan.') + '</p></section>';
  return h;
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest('button'); if (!el) return;
  if (el.dataset.tab) { UI.tab = el.dataset.tab; saveUi(); render(); window.scrollTo(0, 0); return; }
  if (el.dataset.day) { UI.day = +el.dataset.day; render(); return; }
  if (el.dataset.nav) { UI.day = Math.min(30, Math.max(1, UI.day + +el.dataset.nav)); render(); window.scrollTo(0, 0); return; }
  if (el.dataset.shift) { if (locked()) { toast('Buku periode ini ditutup'); return; } var d = getDay(UI.day, true); d.shift = d.shift === el.dataset.shift ? '' : el.dataset.shift; $$('#shift button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.shift === d.shift)); }); touch(); return; }
  if (el.dataset.basis) { S.settings.kmBasis = el.dataset.basis; $$('#basis button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.basis === el.dataset.basis)); }); touch(); updateGaji(); return; }
  if (el.dataset.addtype) { UI.draft.name = ($('#an') || {}).value || ''; UI.draft.abs = ($('#aa') || {}).value || ''; UI.adding = el.dataset.addtype; render(); return; }
  var a = el.dataset.act; if (!a) return;
  if (locked() && (a === 'copyprev' || a === 'clearday')) { toast('Buku periode ini ditutup'); return; }
  if (a === 'copyprev') {
    var prev = getDay(UI.day - 1); if (!prev) { toast('Hari sebelumnya masih kosong'); return; }
    var cur = getDay(UI.day, true); cur.shift = prev.shift; cur.slots = prev.slots.map(function (s) { return { l: s.l, d: s.d, bd: s.bd, pdf: '', note: '' }; });
    touch(); render(); toast('Slot disalin. KM PDF dikosongkan.');
  } else if (a === 'clearday') {
    if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Ketuk lagi untuk mengosongkan'; setTimeout(function () { el.dataset.sure = ''; el.textContent = 'Kosongkan hari ini'; }, 3000); return; }
    delete P().days[String(UI.day)]; touch(); render(); toast('Hari dikosongkan');
  } else if (a === 'copyrekap') copyText(rekapText());
  else if (a === 'csv') saveCsv();
  else if (a === 'closebook') {
    if (el.dataset.sure !== '1') {
      var inc = totals(1, N()).incomplete; el.dataset.sure = '1';
      el.textContent = inc ? inc + ' slot belum lengkap. Ketuk lagi untuk tutup' : 'Ketuk lagi untuk menutup buku';
      setTimeout(function () { el.dataset.sure = ''; el.textContent = 'Tutup buku'; }, 3500); return;
    }
    P().closed = true; P().closedAt = todayStr(); touch(); render(); toast('Buku periode ditutup');
  }
  else if (a === 'openbook') { P().closed = false; P().closedAt = ''; touch(); render(); toast('Buku dibuka kembali'); }
  else if (a === 'newperiod') {
    var lastK = periodKeys().slice(-1)[0], ld = parseDate(S.periods[lastK].end); ld.setDate(ld.getDate() + 1);
    var ns = iso(ld); if (!S.periods[ns]) { S.periods[ns] = newPeriod(ns, S.settings.closeDay); touch(); }
    selectPeriod(ns); render(); toast('Periode ' + periodLabel(P()));
  }
  else if (a === 'backup') { downloadFile('cadangan-ritase-' + todayStr() + '.json', JSON.stringify(serialize()), 'application/json'); toast('Cadangan diunduh'); }
  else if (a === 'restore') { var rf = $('#restoreFile'); if (rf) rf.click(); }
  else if (a === 'addopen') { UI.adding = el.dataset.type; UI.draft = { name: '', abs: '' }; UI.edit = null; render(); }
  else if (a === 'addcancel') { UI.adding = null; render(); }
  else if (a === 'addsave') addSave();
  else if (a === 'editloc') { var same = UI.edit && UI.edit.type === el.dataset.type && UI.edit.name === el.dataset.name; UI.edit = same ? null : { type: el.dataset.type, name: el.dataset.name, confirm: false }; UI.adding = null; render(); }
  else if (a === 'canceledit') { UI.edit = null; render(); }
  else if (a === 'saveloc') editSave();
  else if (a === 'delloc') {
    if (!UI.edit.confirm) { UI.edit.confirm = true; render(); return; }
    var t = UI.edit.type, nm = UI.edit.name;
    if (t === 'l') S.loadings = S.loadings.filter(function (x) { return x.name !== nm; }); else S.dumpings = S.dumpings.filter(function (x) { return x.name !== nm; });
    S.dist = S.dist.filter(function (x) { return !(t === 'l' ? x.l === nm : x.d === nm); }); rebuildDist(); UI.edit = null; touch(); render(); toast('Lokasi dihapus');
  }
});
function nameError(type, name, except) {
  if (!name) return 'Nama lokasi belum diisi.';
  if (/[|]/.test(name)) return 'Nama tidak boleh memakai tanda |.';
  if (name === BD || name.toLowerCase() === BD_LABEL.toLowerCase()) return 'Nama itu sudah dipakai oleh bawaan.';
  var list = type === 'l' ? S.loadings : S.dumpings;
  if (list.some(function (x) { return x.name.toLowerCase() === name.toLowerCase() && x.name !== except; })) return 'Nama itu sudah ada di daftar.';
  return '';
}
function addSave() {
  var t = UI.adding, name = ($('#an').value || '').trim(), err = nameError(t, name, null), box = $('#aerr');
  if (err) { box.textContent = err; box.hidden = false; return; }
  var abs = t === 'l' ? ($('#aa').value || '') : '';
  var opp = t === 'l' ? S.dumpings : S.loadings;
  if (t === 'l') S.loadings.push({ name: name, abs: isNum(abs) ? +abs : '' }); else S.dumpings.push({ name: name });
  $$('[data-ad]').forEach(function (inp) {
    var o = opp[+inp.dataset.ad]; if (!o || !isNum(inp.value)) return;
    S.dist.push(t === 'l' ? { l: name, d: o.name, km: +inp.value } : { l: o.name, d: name, km: +inp.value });
  });
  rebuildDist(); UI.adding = null; UI.draft = { name: '', abs: '' }; touch(); render(); toast('Lokasi ditambahkan');
}
function editSave() {
  var e = UI.edit, name = ($('#en').value || '').trim(), err = nameError(e.type, name, e.name);
  if (err) { toast(err); return; }
  var list = e.type === 'l' ? S.loadings : S.dumpings, obj = list.filter(function (x) { return x.name === e.name; })[0];
  if (e.type === 'l') { var a = $('#ea').value; obj.abs = isNum(a) ? +a : ''; }
  renameLoc(e.type, e.name, name); obj.name = name; rebuildDist(); UI.edit = null; touch(); render(); toast('Perubahan disimpan');
}
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'pperiod') { selectPeriod(t.value); render(); window.scrollTo(0, 0); return; }
  if (t.id === 'restoreFile') {
    var file = t.files && t.files[0]; if (!file) return;
    var fr = new FileReader();
    fr.onload = function () { try { var j = JSON.parse(String(fr.result)); if (!j || !j.loadings) throw 0; S = normalize(j); rebuildDist(); initUi(); touch(); render(); toast('Data dipulihkan'); } catch (x) { toast('File cadangan tidak valid'); } };
    fr.readAsText(file); t.value = ''; return;
  }
  if (t.id === 'rf' || t.id === 'rt') {
    UI.from = +$('#rf').value; UI.to = +$('#rt').value;
    if (UI.from > UI.to) { if (t.id === 'rf') UI.to = UI.from; else UI.from = UI.to; }
    render(); return;
  }
  var card = t.closest('.slot');
  if (card && locked()) return;
  if (card && (t.dataset.f === 'l' || t.dataset.f === 'd')) {
    var i = +card.dataset.slot, n = UI.day; ensureShift(n);
    var s = getDay(n, true).slots[i]; s[t.dataset.f] = t.value;
    if (t.dataset.f === 'd' && t.value !== BD) s.bd = '';
    touch(); card.outerHTML = slotHtml(n, i); refreshSlotDerived(i);
  }
});
document.addEventListener('input', function (e) {
  var t = e.target, card = t.closest('.slot');
  if (card && locked()) return;
  if (card && t.dataset.f && t.dataset.f !== 'l' && t.dataset.f !== 'd') {
    var i = +card.dataset.slot, n = UI.day; ensureShift(n);
    var s = getDay(n, true).slots[i];
    if (t.dataset.f === 'dist') { if (s.l && s.d) setDist(s.l, s.d, t.value); }
    else s[t.dataset.f] = t.value;
    touch(); refreshSlotDerived(i); return;
  }
  if (t.dataset.mx) {
    var p = t.dataset.mx.split(','), l = S.loadings[+p[0]], d = S.dumpings[+p[1]];
    setDist(l.name, d.name, t.value); t.classList.toggle('warn', !isNum(t.value)); touch();
    var mp = missingPairs(), inf = $('#mxinfo'); if (inf) inf.textContent = (mp ? mp + ' pasangan belum punya jarak (kotak kuning).' : 'Semua pasangan sudah punya jarak.') + ' Ubah angka langsung di kotak, tersimpan otomatis.';
    return;
  }
  if (t.dataset.gp) { P()[t.dataset.gp] = t.value === '' ? '' : +t.value; touch(); updateGaji(); return; }
  if (t.dataset.g) {
    var k = t.dataset.g, num = ['tarif', 'gp', 'insentif', 'onsite', 'openDay', 'closeDay', 'hariBulan', 'bpjsKes', 'bpjsTk', 'pph'].indexOf(k) >= 0;
    S.settings[k] = num ? (t.value === '' ? '' : +t.value) : t.value;
    touch(); updateGaji();
    if (k === 'nama' || k === 'jabatan' || k === 'lokasi') $('#sub').textContent = [S.settings.jabatan, S.settings.lokasi].filter(Boolean).join(' · ');
  }
});
document.addEventListener('visibilitychange', async function () {
  if (document.visibilityState !== 'visible' || !db || dirty || saving || !loaded) return;
  var ae = document.activeElement; if (ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName)) return;
  try {
    var snap = await db.doc('app/main').get();
    if (snap.exists && !dirty && snap.data().updated !== lastSaved) { S = normalize(snap.data()); lastSaved = snap.data().updated || ''; rebuildDist(); render(); }
  } catch (e) {}
});
boot();
if (STANDALONE && 'serviceWorker' in navigator && /^https?:/.test(location.protocol)) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
})();
